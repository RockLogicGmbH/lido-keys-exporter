include:
  - docker-compose.app.yml

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.6.5
    restart: unless-stopped
    # Grafana does not expand environment variables inside provisioned alert rules, so the
    # exit request and endpoint lag thresholds are rendered into a copy of the provisioning directory.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for v in "$$LKE_EXIT_RESPONSE_HOURS" "$$LKE_EXIT_WARN_HOURS" "$$LKE_EXIT_CRIT_HOURS" "$$LKE_ENDPOINT_LAG"; do
          case "$$v" in ''|*[!0-9.]*) echo "LKE_EXIT_RESPONSE_HOURS/LKE_EXIT_WARN_HOURS/LKE_EXIT_CRIT_HOURS/LKE_ENDPOINT_LAG must be numbers" >&2; exit 1;; esac
        done
        rm -rf /tmp/provisioning
        cp -r /etc/grafana/provisioning /tmp/provisioning
        mkdir -p /tmp/provisioning/plugins
        sed -i "s/[$$]{LKE_EXIT_RESPONSE_HOURS}/$$LKE_EXIT_RESPONSE_HOURS/g; s/[$$]{LKE_EXIT_WARN_HOURS}/$$LKE_EXIT_WARN_HOURS/g; s/[$$]{LKE_EXIT_CRIT_HOURS}/$$LKE_EXIT_CRIT_HOURS/g; s/[$$]{LKE_ENDPOINT_LAG}/$$LKE_ENDPOINT_LAG/g" /tmp/provisioning/alerting/*.yml
        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/provisioning
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      LKE_EXIT_RESPONSE_HOURS: ${LKE_EXIT_RESPONSE_HOURS:-2}
      LKE_EXIT_WARN_HOURS: ${LKE_EXIT_WARN_HOURS:-48}
      LKE_EXIT_CRIT_HOURS: ${LKE_EXIT_CRIT_HOURS:-84}
      LKE_ENDPOINT_LAG: ${LKE_ENDPOINT_LAG:-5}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
