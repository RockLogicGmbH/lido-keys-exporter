[project]
name = "lido-keys-exporter"
version = "0.1.1"
description = "Prometheus exporter for deposits, Lido exit requests and EIP-7002 triggered withdrawals of a set of Lido validator keys"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
dependencies = [
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "eth-abi>=5.0",
    "eth-utils>=4.0",
    "eth-hash[pycryptodome]>=0.7",
]

[project.scripts]
lido-keys-exporter = "src.__main__:main"

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
